appId: com.nt.studio
productName: NT Studio
directories:
  output: release
files:
  - out/**/*
  - package.json
  - build/icon.ico
  - build/icon.png
asarUnpack:
  - "**/node_modules/node-pty/**"
  - "**/node_modules/better-sqlite3/**"
npmRebuild: false
win:
  target: nsis
  icon: build/icon.ico
  requestedExecutionLevel: asInvoker
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
